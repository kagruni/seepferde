name: Build and Deploy Static Site

on:
  pull_request:
    paths:
      - "content/**"
      - "cms-auth/**"
      - "public/admin/**"
      - "public/cms-auth/**"
      - "public/.htaccess"
      - "public/icons/**"
      - "public/images/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "eslint.config.mjs"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Rebuild daily so date-sensitive event states stay current.
    - cron: "17 2 * * *"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, openssl

      - name: Install dependencies
        run: npm ci

      - name: Test CMS authentication gateway
        run: npm run cms:auth:test

      - name: Test Working Equitation registration
        run: npm run registration:test

      - name: Verify CMS browser dialog replacements
        run: npm run cms:bundle:check

      - name: Validate CMS content
        run: npm run content:validate

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify clean-route export
        run: node scripts/verify-static-export.mjs

  build-and-deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, openssl

      - name: Install dependencies
        run: npm ci

      - name: Test CMS authentication gateway
        run: npm run cms:auth:test

      - name: Test Working Equitation registration
        run: npm run registration:test

      - name: Verify CMS browser dialog replacements
        run: npm run cms:bundle:check

      - name: Validate CMS content
        run: npm run content:validate

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify clean-route export
        run: node scripts/verify-static-export.mjs

      - name: Validate FTPS deployment configuration
        env:
          CPANEL_FTP_HOST: ${{ vars.CPANEL_FTP_HOST }}
          CPANEL_FTP_REMOTE_PATH: ${{ vars.CPANEL_FTP_REMOTE_PATH }}
        run: |
          if [[ -z "$CPANEL_FTP_HOST" ]]; then
            echo "::error::Repository variable CPANEL_FTP_HOST is not configured."
            exit 1
          fi

          if [[ -z "$CPANEL_FTP_REMOTE_PATH" ]]; then
            echo "::error::Repository variable CPANEL_FTP_REMOTE_PATH is not configured."
            exit 1
          fi

          if [[ "$CPANEL_FTP_REMOTE_PATH" != */ ]]; then
            echo "::error::CPANEL_FTP_REMOTE_PATH must end with a slash."
            exit 1
          fi

      - name: Sync exported site to cPanel over FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ vars.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ vars.CPANEL_FTP_PORT || '21' }}
          security: strict
          local-dir: ./out/
          server-dir: ${{ vars.CPANEL_FTP_REMOTE_PATH }}
